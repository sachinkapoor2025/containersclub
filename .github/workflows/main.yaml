name: Deploy Containers Club  (Backend + Frontend)

on:
  push:
    branches:
      - main
      - dev
      - feature/*

jobs:
  deploy-backend:
    name: Deploy Backend (SAM)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS SAM
        uses: aws-actions/setup-sam@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Store LLM API Key in AWS Secrets Manager
      - name: Store LLM API Key in Secrets Manager
        run: |
          SECRET_NAME="containers-club-dev-llm-key"
          LLM_KEY="${{ secrets.LLM_KEY }}"

          if [ -n "$LLM_KEY" ]; then
            echo "Storing LLM API key in AWS Secrets Manager..."
            aws secretsmanager put-secret-value \
              --secret-id "$SECRET_NAME" \
              --secret-string "{\"openai_api_key\":\"$LLM_KEY\"}" \
              --no-cli-pager || \
            aws secretsmanager create-secret \
              --name "$SECRET_NAME" \
              --secret-string "{\"openai_api_key\":\"$LLM_KEY\"}" \
              --no-cli-pager
            echo "LLM API key stored successfully"
          else
            echo "LLM_KEY not found in GitHub secrets, skipping..."
          fi

      - name: SAM Validate
        working-directory: Backend
        run: sam validate
      # ----------------------------
      # Backend: SAM Build
      # ----------------------------
      - name: SAM Build
        working-directory: Backend
        run: |
          sam build

      - name: Ensure CloudFormation rollback is enabled
        run: |
          STACK_NAME=containers-club-dev
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].StackStatus" \
            --output text)

          echo "Current stack status: $STATUS"

          if [[ "$STATUS" == "UPDATE_FAILED" || "$STATUS" == "ROLLBACK_PAUSED" ]]; then
            echo "Re-enabling rollback for $STACK_NAME"
            aws cloudformation continue-update-rollback \
              --stack-name $STACK_NAME
          else
            echo "Stack is healthy, continuing deploy"
          fi

      # ----------------------------
      # Backend: SAM Deploy (uses samconfig.toml)
      # ----------------------------
      - name: SAM Deploy (dev)
        working-directory: Backend
        run: |
          sam deploy \
            --config-env dev \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  deploy-frontend:
    name: Deploy Frontend (S3)
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ----------------------------
      # Frontend: Upload website to S3
      # ----------------------------
      - name: Deploy frontend to S3
        run: |
          aws s3 sync Website/ s3://containers-club-dev-webbucket-elh1uro4wffs \
            --delete \
            --exact-timestamps


      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E18YOLZYXQWBEI \
            --paths "/*"
