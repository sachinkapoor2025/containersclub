<header class="header">
    <div class="header-inner">
      <div class="brand">
        <img src="/images/cc_logo.png" alt="Containers Club logo" />
        <span>Containers Club</span>
      </div>
  
      <!-- Mobile menu button -->
      <button class="menu-btn" aria-label="Open menu"
              aria-controls="primary-nav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
  
      <!-- Primary nav -->
      <nav id="primary-nav" class="nav">
        <a class="secondary" href="/container-tracking-online.html">Track</a>
        <a class="secondary" href="/rent-shipping-container.html">Rent</a>
        <a class="secondary" href="/sell-used-shipping-container.html">Sell</a>
        <a class="secondary" href="/container-type-size.html">Info</a>
        <a class="secondary" href="/loading-offloading.html">On-Off</a>
        <a class="secondary" href="/port-harbour.html">Ports</a>
        <a class="secondary" href="/container-shipping-news.html">News</a>
        <a class="secondary" href="/manage-container.html">MMC</a>
        <a class="secondary" href="/container-insurance-coverage.html">Insurance</a>
      </nav>
    </div>
  </header>
  
  <script>
    // Runs after injection; initializes hamburger toggles for any header instance (including drawers)
    (function () {
      document.querySelectorAll('.menu-btn').forEach(btn => {
        const navId = btn.getAttribute('aria-controls') || 'primary-nav';
        const nav = document.getElementById(navId);
        if (!nav) return;
        btn.addEventListener('click', () => {
          const isOpen = nav.classList.toggle('open');
          btn.setAttribute('aria-expanded', isOpen);
        });
      });
  
      document.querySelectorAll('nav a').forEach(a =>
        a.addEventListener('click', () => {
          document.querySelectorAll('.nav.open').forEach(n => n.classList.remove('open'));
          document.querySelectorAll('.menu-btn').forEach(b => b.setAttribute('aria-expanded', 'false'));
        })
      );
    })();
  </script>
